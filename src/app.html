<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f8f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1e22" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="Client-side portfolio planning, backtesting, tracking and Monte Carlo simulation. Your data never leaves your browser."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<title>Sweetfolio</title>
		<script>
			// Apply the theme before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var t = null;
					try {
						t = localStorage.getItem('sweetfolio-theme');
					} catch (e) {}
					if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
