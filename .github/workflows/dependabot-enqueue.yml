name: Dependabot Enqueue

# Runs after CI completes on a Dependabot PR.
# By this point the auto-approve workflow has already approved the PR,
# so we just need to add it to the merge queue.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    # Only run if CI succeeded and the triggering PR is from Dependabot
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Find PR number from workflow run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number' --repo "$REPO")
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $HEAD_BRANCH"
            exit 0
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Check if PR is approved
        id: review
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # Only enqueue if the PR has been approved (by the auto-approve workflow)
          STATE=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq '.reviewDecision' --repo "$REPO")
          if [ "$STATE" != "APPROVED" ]; then
            echo "PR #$PR_NUMBER is not approved (state: $STATE) — skipping enqueue"
            echo "approved=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "approved=true" >> $GITHUB_OUTPUT

      - name: Enqueue for merge
        if: steps.pr.outputs.number && steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # Check if already in merge queue
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' --repo "$REPO")
          if echo "$LABELS" | grep -q "^merge-queue$"; then
            echo "PR #$PR_NUMBER is already in merge queue — skipping"
            exit 0
          fi

          gh label create merge-queue --color "3CB371" --description "PR is in the merge queue" \
            --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label merge-queue --repo "$REPO"
          gh pr comment "$PR_NUMBER" --body "/merge" --repo "$REPO"
