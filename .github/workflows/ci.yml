name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR Title (Conventional Commit)
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional commit pattern: type(optional-scope): description
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Your title: $PR_TITLE"
            echo ""
            echo "Expected format: <type>(<optional scope>): <description>"
            echo ""
            echo "Examples:"
            echo "  feat: add dark mode toggle"
            echo "  fix(charts): resolve tooltip flickering"
            echo "  perf: batch scatter dots into single canvas path"
            echo "  docs: update self-hosting guide"
            echo ""
            echo "Allowed types: feat, fix, perf, refactor, docs, style, test, build, ci, chore, revert"
            echo ""
            echo "This title becomes the merge commit message and drives the changelog:"
            echo "  feat  → new feature (minor version bump)"
            echo "  fix   → bug fix (patch version bump)"
            echo "  perf  → performance improvement (patch version bump)"
            echo "  other → no version bump, no changelog entry"
            exit 1
          fi

          echo "PR title is valid: $PR_TITLE"

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:licenses
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
